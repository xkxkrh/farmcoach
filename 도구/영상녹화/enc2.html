<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1600" height="900"></canvas>
<script>
function load(src) { return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; }); }
const RUN = Date.now();
async function run() {
  const frames = await (await fetch('/frames.json')).json();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  const cache = new Map();
  const get = k => { if (!cache.has(k)) cache.set(k, load('/f/' + frames[k][1] + '?r=' + RUN)); return cache.get(k); };
  const prefetch = k => { for (let j = k; j < Math.min(frames.length, k + 12); j++) get(j); for (const key of cache.keys()) if (key < k - 2) cache.delete(key); };
  prefetch(0);
  let cur = await get(0);
  ctx.drawImage(cur, 0, 0, cv.width, cv.height);
  const type = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1.4D0028') ? 'video/mp4;codecs=avc1.4D0028' : 'video/mp4;codecs=avc1.42E01F';
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 2200000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start(1000);
  const start = performance.now();
  const end = frames[frames.length - 1][0] + 1.0;
  let i = 0, shown = 0;
  await new Promise(resolve => {
    async function tick() {
      const t = (performance.now() - start) / 1000;
      while (i + 1 < frames.length && frames[i + 1][0] <= t) i++;
      if (i !== shown) { prefetch(i); cur = await get(i); shown = i; }
      ctx.drawImage(cur, 0, 0, cv.width, cv.height);
      if (t < end) requestAnimationFrame(tick); else resolve();
    }
    tick();
  });
  rec.stop(); await done;
  const blob = new Blob(chunks, { type });
  await fetch('/upload', { method: 'POST', body: blob });
  return { type, size: blob.size, seconds: end };
}
</script>
